<div class="page-wrap flex flex-col h-screen">
  <div class="game-host flex-1 min-h-0 w-full relative">
    <div *ngIf="!gameStarted" class="welcome-overlay">

      <!-- Museum Home button (top-left) -->
      <button (click)="goHome()" class="home-btn" aria-label="Back to exhibit menu">
        <i class="fa-solid fa-house"></i>
        <span class="home-label">Menu</span>
      </button>

      <!-- ══ Backdrop: the storm at night ══
           Mt. Pinatubo in the game's own style, on a dark monsoon night.
           Heavy rain in layers, fog over the plain, and lightning that
           lights the whole valley for a moment. The only warm light is
           the lahar's embers and the town's windows (both inside
           welcome_scene.svg). All decorative and aria-hidden.
           Back to front: sky, lightning bolt, clouds, the scene, fog,
           far rain, lightning flash, near rain. -->
      <div class="sky" aria-hidden="true"></div>

      <svg class="bolt" viewBox="0 0 80 260" aria-hidden="true">
        <path d="M46,0 L30,92 L48,96 L22,176 L40,180 L10,260 L62,150 L44,146 L70,74 L50,70 L64,0 Z"
              fill="#eef4ff" stroke="#9fb8ff" stroke-width="3" stroke-linejoin="round"/>
      </svg>

        </svg>
      </div>

      <img class="scene" [src]="sceneUrl" (error)="onSceneError()" alt="" aria-hidden="true" draggable="false" />

      <div class="fog fog-a" aria-hidden="true"></div>
      <div class="fog fog-b" aria-hidden="true"></div>
      <div class="rain rain-far" aria-hidden="true"></div>
      <div class="storm-flash" aria-hidden="true"></div>
      <div class="rain rain-near" aria-hidden="true"></div>

      <div class="vignette" aria-hidden="true"></div>

      <!-- ══ Foreground: logo, tagline, start ══ -->
      <div class="welcome-content">
        <div class="brand">
          <div class="logo-wrap">
            <span class="logo-halo" aria-hidden="true"></span>
            <img class="welcome-logo" src="/lahar-defense/assets/laharaya_logo.png" alt="LAHARAYA" draggable="false" />
          </div>
          <p class="tagline"><span class="tagline-face">Get Saved or Get Buried!</span></p>
        </div>

        <div class="cta">
          <button (click)="startGame()" class="start-btn" aria-label="Tap to begin">
            <span class="start-ring" aria-hidden="true"></span>
            <!-- Pointing hand: a nudge for visitors standing at the kiosk
                 wondering what to do. Fades in after a few seconds. -->
            <svg class="tap-hint" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 13.4V5.2a1.7 1.7 0 0 1 3.4 0v6" fill="#f0bd86" stroke="#3a2913" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
              <path d="M12.4 11.2V9.6a1.6 1.6 0 0 1 3.2 0v2.2m0 0v-1a1.6 1.6 0 0 1 3.2 0V16a5.4 5.4 0 0 1-5.4 5.4h-1.8a5.4 5.4 0 0 1-4.3-2.2l-2.8-3.8a1.7 1.7 0 0 1 2.6-2.2L9 15.2"
                    fill="#f0bd86" stroke="#3a2913" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
            <span class="start-face">
              <svg class="start-play" viewBox="0 0 22 26" aria-hidden="true">
                <path d="M4 3.2 19 13 4 22.8z" fill="#fff" stroke="#3a2913" stroke-width="3" stroke-linejoin="round"/>
              </svg>
              <span class="start-text">Tap to Begin</span>
            </span>
          </button>
          <p class="cta-note">Defend a Pampanga town from Mt. Pinatubo's lahar</p>
        </div>
      </div>
    </div>

    <!-- Embedded game -->
    <iframe *ngIf="gameStarted" class="game-frame w-full h-full border-0 block" [src]="gameUrl"></iframe>
  </div>
</div>
