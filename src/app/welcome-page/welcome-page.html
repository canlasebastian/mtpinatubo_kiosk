<div class="nav-bar fixed top-0 w-full bg-transparent z-10 pointer-events-none">
    <div class="nav-container px-10 py-7  flex justify-between">
        <div class="nav-logo">
            <a href = ""><img src = "/assets/images/logos/mainlogo.png"></a>
        </div>
    </div>
</div>

<!-- Music Toggle Button -->
<button
  (click)="toggleMusic()"
  class="fixed bottom-20 left-12 z-50 cursor-pointer focus:outline-none bg-transparent border-none pointer-events-auto"
  [attr.aria-label]="isMusicPlaying ? 'Mute music' : 'Play music'"
>
  <i
    class="fa-solid text-5xl text-white"
    [ngClass]="isMusicPlaying ? 'fa-volume-high' : 'fa-volume-mute'"
  ></i>
</button>

<div class="welcome-wrapper" (click)="toggleColor()">

  <div class="bg-layer" [class.colored]="isColored">
    <video #bgVideo autoplay loop muted playsinline class="video-background">
    <source src="/assets/videos/ptvid4.mp4" type="video/mp4">
  </video>
    <div class="gradient-overlay"></div>
  </div>



  <section class="welcome-container flex h-screen items-center justify-center bg-cover bg-center" style="background-image: url('your-mountain-background.jpg');">
  <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>

  <div class="heading relative flex flex-col items-end font-serif uppercase select-none">
    <h1 class="text-[5rem] sm:text-[10rem] md:text-[10rem] font-bold text-[#D5A822] tracking-[-9%] leading-[0.7]">
      Pinatubo
    </h1>
    
    <h2 class="text-2xl sm:text-4xl md:text-5xl font-normal text-white mr-2 sm:mr-6 tracking-[-9%]">
      Museum
    </h2>
  </div>
</section>

</div>
